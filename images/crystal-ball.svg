<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img">
<title>Token Wisdom crystal ball</title>
<defs>
<style>
@keyframes pulse-inner{0%,100%{opacity:.5}50%{opacity:.92}}
@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes spark{0%,100%{opacity:0;r:0}20%{opacity:1}50%{opacity:.8;r:2.2px}80%{opacity:.2}}
@keyframes spark2{0%,100%{opacity:0;r:0}35%{opacity:.8}55%{opacity:1;r:1.8px}85%{opacity:0}}
@keyframes mist-drift{0%{transform:translate(0,0)}40%{transform:translate(-6px,-5px)}70%{transform:translate(4px,7px)}100%{transform:translate(0,0)}}
@keyframes rim-sweep{0%,100%{stroke-dashoffset:940}50%{stroke-dashoffset:0}}
@keyframes base-glow{0%,100%{opacity:.2}50%{opacity:.44}}
@keyframes flare-event{0%,72%,100%{opacity:0}76%{opacity:1}83%{opacity:.95}91%{opacity:0}}
@keyframes flare-streak{0%,72%,100%{opacity:0}76%{opacity:.7}83%{opacity:.65}91%{opacity:0}}
.cb-inner{animation:pulse-inner 3.4s ease-in-out infinite}
.cb-ring1{transform-origin:200px 200px;animation:spin-cw 12s linear infinite}
.cb-ring2{transform-origin:200px 200px;animation:spin-ccw 9s linear infinite}
.cb-ring3{transform-origin:200px 200px;animation:spin-cw 17s linear infinite}
.cb-mist1{animation:mist-drift 8s ease-in-out infinite;transform-origin:200px 205px}
.cb-mist2{animation:mist-drift 11s ease-in-out infinite reverse;transform-origin:200px 195px}
.cb-sa{animation:spark 2.8s ease-in-out 0s infinite}
.cb-sb{animation:spark2 3.5s ease-in-out .6s infinite}
.cb-sc{animation:spark 4s ease-in-out 1.3s infinite}
.cb-sd{animation:spark2 2.5s ease-in-out 2s infinite}
.cb-se{animation:spark 3.2s ease-in-out .9s infinite}
.cb-rim{animation:rim-sweep 7s ease-in-out infinite}
.cb-bg{animation:base-glow 3.4s ease-in-out infinite}
.cb-flare{animation:flare-event 9s ease-in-out 1.5s infinite}
.cb-flare-h{animation:flare-streak 9s ease-in-out 1.5s infinite}
.cb-flare-v{animation:flare-streak 9s ease-in-out 1.6s infinite}
.cb-flare-d{animation:flare-streak 9s ease-in-out 1.7s infinite}
</style>
<radialGradient id="cb-rg-sphere" cx="65%" cy="22%" r="82%">
  <stop offset="0%" stop-color="#ede8e0"/>
  <stop offset="8%" stop-color="#c8bfaf"/>
  <stop offset="25%" stop-color="#4a3d2c"/>
  <stop offset="52%" stop-color="#1a1408"/>
  <stop offset="78%" stop-color="#0a0804"/>
  <stop offset="100%" stop-color="#040300"/>
</radialGradient>
<radialGradient id="cb-rg-inner" cx="50%" cy="58%" r="52%">
  <stop offset="0%" stop-color="#c8521a" stop-opacity=".95"/>
  <stop offset="30%" stop-color="#7a2e0a" stop-opacity=".65"/>
  <stop offset="100%" stop-color="#1a1408" stop-opacity="0"/>
</radialGradient>
<radialGradient id="cb-rg-mist1" cx="48%" cy="52%" r="55%">
  <stop offset="0%" stop-color="#e8a060" stop-opacity=".42"/>
  <stop offset="100%" stop-color="#c8521a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="cb-rg-mist2" cx="42%" cy="45%" r="50%">
  <stop offset="0%" stop-color="#f0b87a" stop-opacity=".25"/>
  <stop offset="100%" stop-color="#c8521a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="cb-rg-sheen" cx="65%" cy="22%" r="52%">
  <stop offset="0%" stop-color="rgba(255,248,240,.1)"/>
  <stop offset="50%" stop-color="rgba(255,248,240,0)"/>
</radialGradient>
<radialGradient id="cb-rg-wood-body" cx="38%" cy="28%" r="72%">
  <stop offset="0%" stop-color="#d4935a"/>
  <stop offset="40%" stop-color="#a86830"/>
  <stop offset="100%" stop-color="#5e3410"/>
</radialGradient>
<radialGradient id="cb-rg-wood-rim" cx="40%" cy="30%" r="68%">
  <stop offset="0%" stop-color="#cc8840"/>
  <stop offset="55%" stop-color="#8a5520"/>
  <stop offset="100%" stop-color="#4a2808"/>
</radialGradient>
<radialGradient id="cb-rg-shadow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#1a0a04" stop-opacity=".45"/>
  <stop offset="100%" stop-color="#1a0a04" stop-opacity="0"/>
</radialGradient>
<radialGradient id="cb-rg-flare" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="white"/>
  <stop offset="40%" stop-color="rgba(255,255,255,.9)"/>
  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
</radialGradient>
<clipPath id="cb-clip-sphere">
  <circle cx="200" cy="232" r="148"/>
</clipPath>
<clipPath id="cb-clip-above-rim">
  <rect x="0" y="0" width="400" height="349"/>
</clipPath>
<filter id="cb-f-blur-heavy" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<filter id="cb-f-blur-soft" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="cb-f-blur-micro" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.5"/>
</filter>
<filter id="cb-f-rim-glow" x="-10%" y="-10%" width="120%" height="120%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="cb-f-flare" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<ellipse cx="200" cy="434" rx="106" ry="11" fill="url(#cb-rg-shadow)" filter="url(#cb-f-blur-heavy)"/>

<path d="M 100,348 Q 92,400 200,408 Q 308,400 300,348 Z" fill="url(#cb-rg-wood-body)"/>
<path d="M 108,362 Q 200,372 292,362" fill="none" stroke="#7a4810" stroke-width=".9" stroke-opacity=".4"/>
<path d="M 100,378 Q 200,392 300,378" fill="none" stroke="#6a3a0c" stroke-width=".7" stroke-opacity=".32"/>
<path d="M 102,396 Q 200,410 298,396" fill="none" stroke="#7a4810" stroke-width=".6" stroke-opacity=".24"/>
<path d="M 100,348 A 100,14 0 0 1 300,348" fill="url(#cb-rg-wood-rim)"/>
<ellipse cx="200" cy="350" rx="72" ry="10" fill="#2a1006" opacity=".7"/>
<ellipse cx="200" cy="406" rx="66" ry="8" fill="#4e2c08"/>
<ellipse cx="200" cy="406" rx="63" ry="6" fill="#6a3e14"/>
<ellipse cx="180" cy="404" rx="20" ry="3" fill="rgba(180,110,50,.25)"/>

<g clip-path="url(#cb-clip-above-rim)">
  <circle cx="200" cy="232" r="152" fill="none" stroke="#888080" stroke-width="5" stroke-opacity=".35"/>
  <circle cx="200" cy="232" r="150" fill="none" stroke="#b0a8a0" stroke-width="1.5" stroke-opacity=".22"/>
  <circle cx="200" cy="232" r="148" fill="url(#cb-rg-sphere)"/>
  <g clip-path="url(#cb-clip-sphere)">
    <ellipse cx="198" cy="215" rx="96" ry="80" fill="url(#cb-rg-inner)" class="cb-inner"/>
    <ellipse cx="208" cy="205" rx="80" ry="60" fill="url(#cb-rg-mist1)" class="cb-mist1"/>
    <ellipse cx="186" cy="195" rx="65" ry="48" fill="url(#cb-rg-mist2)" class="cb-mist2"/>
    <g class="cb-ring1">
      <ellipse cx="200" cy="200" rx="115" ry="55" fill="none" stroke="#c8521a" stroke-width="1" stroke-opacity=".25"/>
    </g>
    <g class="cb-ring2">
      <ellipse cx="200" cy="200" rx="88" ry="40" fill="none" stroke="#e8a060" stroke-width=".8" stroke-opacity=".2"/>
    </g>
    <g class="cb-ring3">
      <ellipse cx="200" cy="200" rx="62" ry="28" fill="none" stroke="#f0c080" stroke-width=".6" stroke-opacity=".16"/>
    </g>
    <circle cx="158" cy="185" r="1.8" fill="#ffb85c" class="cb-sa"/>
    <circle cx="236" cy="175" r="1.5" fill="#fff0d0" class="cb-sb"/>
    <circle cx="170" cy="210" r="1.8" fill="#ffb860" class="cb-sc"/>
    <circle cx="248" cy="190" r="1.5" fill="#ffd090" class="cb-sd"/>
    <circle cx="162" cy="165" r="1.8" fill="#ffe0a0" class="cb-se"/>

    <!-- ═══ LENS FLARE — fires every 9s, bold enough to read at 17px ═══ -->
    <!-- Halo bloom -->
    <circle cx="268" cy="128" r="70" fill="url(#cb-rg-flare)" class="cb-flare"/>
    <!-- Long horizontal streak -->
    <ellipse cx="268" cy="128" rx="148" ry="6" fill="white" class="cb-flare-h"/>
    <!-- Shorter vertical streak -->
    <ellipse cx="268" cy="128" rx="5" ry="90" fill="white" class="cb-flare-v"/>
    <!-- Diagonal streaks -->
    <ellipse cx="268" cy="128" rx="80" ry="4" fill="white" transform="rotate(45 268 128)" class="cb-flare-d"/>
    <ellipse cx="268" cy="128" rx="65" ry="3" fill="white" transform="rotate(-45 268 128)" class="cb-flare-d"/>
    <!-- Bright core -->
    <circle cx="268" cy="128" r="18" fill="url(#cb-rg-flare)" filter="url(#cb-f-flare)" class="cb-flare"/>
    <circle cx="268" cy="128" r="9" fill="white" class="cb-flare"/>
  </g>

  <circle cx="200" cy="232" r="148" fill="url(#cb-rg-sheen)"/>
  <circle cx="200" cy="232" r="148" fill="none" stroke="#050010" stroke-width="10" stroke-opacity=".5"/>
  <circle cx="200" cy="232" r="148" fill="none" stroke="rgba(200,130,80,.3)" stroke-width="2" stroke-dasharray="68 930" class="cb-rim" filter="url(#cb-f-rim-glow)"/>
  <ellipse cx="183" cy="320" rx="28" ry="10" fill="rgba(200,82,26,.3)" transform="rotate(-12 183 320)" filter="url(#cb-f-blur-micro)">
    <animate attributeName="opacity" values=".28;.5;.28" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Static specular highlight -->
  <ellipse cx="258" cy="148" rx="38" ry="22" fill="rgba(255,252,245,.45)" transform="rotate(28 258 148)" filter="url(#cb-f-blur-micro)"/>
  <ellipse cx="268" cy="135" rx="14" ry="8" fill="rgba(255,255,255,.72)" transform="rotate(28 268 135)"/>
  <circle cx="278" cy="128" r="3.5" fill="white"/>
</g>

<path d="M 100,348 A 100,14 0 0 0 300,348 L 300,349 A 100,14 0 0 1 100,349 Z" fill="url(#cb-rg-wood-body)"/>
<path d="M 100,348 A 100,14 0 0 0 300,348" fill="url(#cb-rg-wood-rim)"/>
<path d="M 100,348 A 100,14 0 0 0 300,348" fill="none" stroke="#e8aa58" stroke-width="1.2" stroke-opacity=".35"/>
<path d="M 116,351 A 84,11 0 0 0 284,351" fill="none" stroke="#2a1006" stroke-width="2.5" stroke-opacity=".45"/>
<ellipse cx="136" cy="348" rx="20" ry="4" fill="#dda050" opacity=".28" transform="rotate(-5 136 348)"/>
<ellipse cx="200" cy="350" rx="70" ry="7" fill="#c8521a" opacity=".14" filter="url(#cb-f-blur-micro)" class="cb-bg"/>
</svg>
