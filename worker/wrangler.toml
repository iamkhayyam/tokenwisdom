name = "token-wisdom-edge"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Origin Express API (Railway). Override per-environment as needed.
[vars]
ORIGIN = "https://token-wisdom-api.up.railway.app"
ALLOWED_ORIGIN = "https://tokenwisdom.ai"

# Rate-limit counters. Create with:
#   wrangler kv namespace create RL
# then paste the returned id below.
[[kv_namespaces]]
binding = "RL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Shared secret the origin checks (X-Edge-Secret). Set with:
#   wrangler secret put EDGE_SHARED_SECRET
# (must match the API's EDGE_SHARED_SECRET env var)
