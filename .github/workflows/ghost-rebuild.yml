name: Rebuild site from Ghost

on:
  repository_dispatch:
    types: [ghost-content-updated]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # re-arm card-backfill.yml (see first step)

concurrency:
  group: ghost-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      # GitHub auto-disables a scheduled workflow after 60 days without a commit
      # (card-backfill.yml went `disabled_inactivity` on 2026-10-07 after a quiet
      # stretch), and it stays off until someone notices and clicks Enable. Every
      # publish comes through here, so re-arm the backstop on each run: a quiet
      # spell can still disable it, but the next post turns it back on. The
      # enable endpoint is idempotent (204 whether or not it was disabled), and
      # this step must never block the publish itself.
      - name: Re-arm the card-backfill schedule
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/card-backfill.yml/enable"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install Pillow

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Pull latest content from Ghost
        run: python3 backup.py

      # Cards render and sync BEFORE generate_site.py — data/social_cards.json
      # must already reflect any new post's card when generate_site.py resolves
      # og:image, or the newly published post ships with the generic default
      # until the next rebuild happens to run.
      #
      # Both steps continue on error rather than block the run: a Chrome or R2
      # hiccup shouldn't hold back publishing the post itself. The card-backfill
      # workflow (.github/workflows/card-backfill.yml) sweeps up anything missed
      # here, and post_social_card_url() already treats "no manifest entry" as
      # the safe, well-tested fallback to og-default.png.
      - name: Render new social cards
        continue-on-error: true
        env:
          SOCIAL_CARD_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python3 make_social_cards.py

      - name: Sync social cards to R2
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: python3 r2_sync.py

      - name: Regenerate static site
        run: python3 generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "tw-ghost-bot"
          git config user.email "tw-ghost-bot@users.noreply.github.com"
          git add docs/ data/ images/
          if git diff --cached --quiet; then
            echo "No content changes, nothing to deploy."
            exit 0
          fi
          git commit -m "Rebuild from Ghost CMS update"
          git push
